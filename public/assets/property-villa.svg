<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="vsky" x1="320" y1="0" x2="320" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2EADB"/>
      <stop offset="1" stop-color="#E4D6BE"/>
    </linearGradient>
    <linearGradient id="vpool" x1="300" y1="300" x2="420" y2="380" gradientUnits="userSpaceOnUse">
