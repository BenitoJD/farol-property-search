      <path d="M98 330c-16-14-14-30-2-40 4 14 12 20 24 22-8 8-14 12-24 18Z" fill="#5A7864"/>
      <path d="M548 330h26l-4 30h-18Z" fill="#B2633F"/>
      <path d="M560 330c-12-12-10-24 0-32 2 10 8 16 18 18-6 6-12 10-18 14Z" fill="#5A7864"/>
