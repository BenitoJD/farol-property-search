    <rect x="242" y="220" width="52" height="60" fill="#355044"/>
    <rect x="247" y="225" width="42" height="50" fill="#AFC9BA"/>
    <path d="M268 225v50M247 250h42" stroke="#355044" stroke-width="2"/>
    <rect x="358" y="218" width="84" height="56" fill="#355044"/>
    <rect x="363" y="223" width="74" height="46" fill="#B7CFC1"/>
